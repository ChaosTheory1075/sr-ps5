[project]
name = "sr1"
sdk_version = "0.9.0"

[entrypoint]
# Saints Row (545107D1): the disc's default.xex with Title Update 1's default.xexp beside it; the loader
# applies the patch, so the code generated is the updated game's.
file_path = "assets/default.xex"
out_directory_path = "generated"
includes = ["sr1_config.toml"]
